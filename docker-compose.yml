services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boardmanager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  server:
    build: ./server
    environment:
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: your-secret-here
      CLIENT_URL: http://localhost
      DATABASE_URL: postgresql://postgres:postgres@db:5432/boardmanager?schema=public
    ports:
      - "3000:3000"
    depends_on:
      - db

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data: